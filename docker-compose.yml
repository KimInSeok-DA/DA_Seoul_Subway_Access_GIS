# 교차 검증용 로컬 PostGIS. 비밀번호는 .env의 POSTGIS_PASSWORD
# 실행: docker compose up -d   /  정리: docker compose down -v
services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: subway_access_postgis
    environment:
      POSTGRES_DB: subway_access
      POSTGRES_USER: gis
      POSTGRES_PASSWORD: ${POSTGIS_PASSWORD:?.env에 POSTGIS_PASSWORD를 넣으세요}
    ports:
      - "127.0.0.1:5433:5432"   # 이 PC에서만 접속, 다른 PostgreSQL과 겹치지 않게 5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gis -d subway_access"]
      interval: 3s
      retries: 20
